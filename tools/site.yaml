# 人物頁分組（順序即頁面順序）
traditions:
  pre: Pre-multitrack tradition
  chen: Chen Chih-Yuan tradition
  electone: Electone tradition
  post: Post-Chen era

portrait_notice: >-
  Portraits and biographical data: Taipei Music Center, Taiwan Popular Music Database (pmdb.taipei), “Oral
  History of Senior Musicians”. Reproduced here for non-commercial academic research under the database’s
  intellectual property statement; all rights remain with the Center and the rights holders. Biographies are
  paraphrased, not copied.

